name: Build

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    types: [synchronize, opened, reopened, ready_for_review]

jobs:
  textgrabber2:
    name: TextGrabber2
    runs-on: xcode-27
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v5
      - name: Build TextGrabber2
        run: |
          xcodebuild build -scheme TextGrabber2 -destination 'generic/platform=macOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
